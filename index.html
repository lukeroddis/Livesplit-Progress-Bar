<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="doc-title">LiveSplit Minimal Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Layout Editor Toolbar -->
  <div class="layout-toolbar" id="layout-toolbar">
    <div class="toolbar-title">
      <span>📐 Layout Editor</span>
    </div>
    <div class="toolbar-checkbox-group">
      <label><input type="checkbox" id="cb-toggle-title" checked> Title</label>
      <label><input type="checkbox" id="cb-toggle-timers" checked> Timers</label>
      <label><input type="checkbox" id="cb-toggle-track" checked> Track</label>
    </div>
    <div class="toolbar-select-group">
      <select id="select-visible-splits" title="Number of splits visible on screen">
        <option value="auto">Splits: Auto</option>
        <option value="5">Splits: 5</option>
        <option value="8">Splits: 8</option>
        <option value="10">Splits: 10</option>
        <option value="12">Splits: 12</option>
        <option value="16">Splits: 16</option>
        <option value="20">Splits: 20</option>
        <option value="all">Splits: Fit All</option>
      </select>
      <select id="select-split-angle" title="Text orientation on split nodes">
        <option value="auto">Angle: Auto (Smart)</option>
        <option value="angled">Angle: 40° Tilt</option>
        <option value="horizontal">Angle: Flat</option>
      </select>
    </div>
    <button class="toolbar-btn" id="btn-reset-layout" title="Reset all elements to default positions">↺ Reset</button>
    <button class="toolbar-btn btn-primary" id="btn-lock-layout" title="Lock layout and save (Press Esc or E)">🔒 Lock Layout</button>
  </div>

  <!-- HUD Component 1: Game Title & Category -->
  <div id="hud-comp-title" class="hud-component" data-component-id="title">
    <div class="hud-component-header">
      <span class="hud-drag-handle">::: Game Info</span>
      <div class="hud-comp-controls">
        <span class="hud-scale-badge" id="badge-scale-title">100%</span>
        <button class="hud-btn-icon" data-action="toggle-visibility" title="Toggle visibility">👁</button>
      </div>
    </div>
    <div class="title-group">
      <span class="game-name" id="game-name">Speedrun Overlay</span>
      <span class="category-name" id="category-name">Load .lss or connect LiveSplit</span>
    </div>
    <div class="hud-resize-handle" title="Drag horizontally to scale">⤡</div>
  </div>

  <!-- HUD Component 2: Dual Timers -->
  <div id="hud-comp-timers" class="hud-component" data-component-id="timers">
    <div class="hud-component-header">
      <span class="hud-drag-handle">::: Timers</span>
      <div class="hud-comp-controls">
        <span class="hud-scale-badge" id="badge-scale-timers">100%</span>
        <button class="hud-btn-icon" data-action="toggle-visibility" title="Toggle visibility">👁</button>
      </div>
    </div>
    <div class="timer-group">
      <div class="timer-block" id="block-rta">
        <div class="timer-secondary" id="timer-rta">0:00.00</div>
        <span class="timer-label">Real Time</span>
      </div>
      <div class="timer-block" id="block-igt">
        <div class="timer-primary" id="timer-igt">0:00.00</div>
        <span class="timer-label">Game Time</span>
      </div>
    </div>
    <div class="hud-resize-handle" title="Drag horizontally to scale">⤡</div>
  </div>

  <!-- HUD Component 3: Split Progress Track -->
  <div id="hud-comp-track" class="hud-component docked-bottom" data-component-id="track">
    <div class="hud-component-header">
      <span class="hud-drag-handle">::: Progress Track</span>
      <div class="hud-comp-controls">
        <button class="hud-btn-icon" id="btn-dock-track" title="Toggle bottom dock / free float">⚓ Dock</button>
        <span class="hud-scale-badge" id="badge-scale-track">100%</span>
        <button class="hud-btn-icon" data-action="toggle-visibility" title="Toggle visibility">👁</button>
      </div>
    </div>
    <div class="track-viewport" id="track-viewport">
      <div class="track" id="track"></div>
    </div>
    <div class="hud-resize-handle" title="Drag horizontally to scale">⤡</div>
  </div>

  <!-- Footer Utility Bar -->
  <div class="footer-bar" id="footer-bar">
    <label id="file-trigger" for="file-input">Load / Drop .lss file</label>
    <input type="file" id="file-input" accept=".lss,.xml">
    <div style="display:flex; gap:14px; align-items:center;">
      <span id="gold-toggle-badge" style="cursor:pointer; color: #facc15; text-decoration: underline;" title="Click to toggle Gold Splits">Golds: ON</span>
      <span id="timing-method-badge" style="cursor:pointer; color: rgba(148, 163, 184, 0.9); text-decoration: underline;" title="Click to toggle Game / Real Time">Game Time</span>
      <span id="split-density-badge" style="cursor:pointer; color: rgba(148, 163, 184, 0.9); text-decoration: underline;" title="Click to cycle visible splits (Auto / 8 / 10 / 12 / 16 / All)">Splits: Auto</span>
      <span id="split-angle-badge" style="cursor:pointer; color: rgba(148, 163, 184, 0.9); text-decoration: underline;" title="Click to cycle text angle (Auto / 40° / Flat)">Angle: Auto</span>
      <span id="layout-edit-btn" style="cursor:pointer; color: #38bdf8; text-decoration: underline;" title="Enter Edit Mode to move/resize components (Hotkey: E)">⚙ Edit Layout</span>
      <div id="connection-status">Connecting...</div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
