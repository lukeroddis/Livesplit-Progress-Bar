[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -ra
markers =
    browser: runs the in-browser JS suite in headless Chrome (deselect with -m "not browser")
# In-browser JS line coverage floors, checked on full runs (not with --spec).
# Raise them as coverage improves so it can never quietly drop back.
js_coverage_floor = 84
js_file_coverage_floor = 30
