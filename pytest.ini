[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -ra
markers =
    browser: runs the in-browser JS suite in headless Chrome (deselect with -m "not browser")
# In-browser JS line coverage floors, checked on full runs (not with --spec).
# Raise them as coverage improves so it can never quietly drop back. Keep each about a point
# under the measured value: async/timer paths make the covered-line count vary slightly per run.
js_coverage_floor = 89
js_file_coverage_floor = 70
