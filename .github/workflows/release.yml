name: Release & Package Overlay

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version increment type (leave as 'none' if running on an existing tag)"
        required: true
        default: "patch"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
          - "none"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite
        run: |
          python tests/run_tests.py

      - name: Determine Bump Type
        id: determine_bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump_type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/determine_bump.py

      - name: Bump Version & Tag
        id: bump
        if: env.SKIP_RELEASE != 'true' && env.BUMP_TYPE != 'none'
        run: |
          python scripts/bump_version.py ${{ env.BUMP_TYPE }}
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          echo "NEW_VERSION=v$VERSION" >> $GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --tags

      - name: Resolve Version Tag
        id: resolve_tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          if [ -n "$NEW_VERSION" ]; then
            TAG="$NEW_VERSION"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Target tag: $TAG"

      - name: Build Single-File Distribution
        if: env.SKIP_RELEASE != 'true'
        run: |
          npm run build
          HTML_NAME="livesplit-minimal-overlay-${RELEASE_TAG}.html"
          cp dist/index.html "$HTML_NAME"
          echo "HTML_NAME=$HTML_NAME" >> $GITHUB_ENV
          echo "Built release asset: $HTML_NAME"

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "LiveSplit Progress Bar ${{ env.RELEASE_TAG }}"
          files: ${{ env.HTML_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
