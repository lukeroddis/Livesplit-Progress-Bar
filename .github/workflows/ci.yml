name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push README badge JSON to the badges branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install CI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run Unified Test Suite & Code Coverage
        run: |
          python tests/run_tests.py --coverage --badges .badges

      - name: Build single-file distribution
        run: npm run build

      # README badges read these files via shields.io's endpoint badge. The badges branch is
      # an orphan holding one force-pushed commit, so it never adds history to main.
      - name: Publish README badges
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b badges
          git add tests.json coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update badges for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
