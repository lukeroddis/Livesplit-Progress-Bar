name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets

      - name: Run Unified Test Suite & Code Coverage
        run: |
          python tests/run_tests.py
