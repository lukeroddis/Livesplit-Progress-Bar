<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LiveSplit Overlay - In-Browser Test Runner</title>
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge.pass { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge.fail { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .suite-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .suite-title {
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 20px;
      font-weight: 700;
      font-size: 15px;
      color: #38bdf8;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }
    .test-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      font-size: 14px;
    }
    .test-row:last-child { border-bottom: none; }
    .test-name { color: #cbd5e1; }
    .status-pill {
      font-size: 12px;
      font-family: monospace;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .status-pill.ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .status-pill.error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .error-msg { font-size: 12px; color: #f87171; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- Hidden dummy DOM required for script imports -->
  <div style="display:none;">
    <div id="game-name"></div>
    <div id="category-name"></div>
    <div id="timer-rta"></div>
    <div id="timer-igt"></div>
    <div id="block-igt"></div>
    <div id="track-viewport">
      <div id="track">
        <div id="item-0" class="split-item">
          <div id="fill-0" class="segment-bar-fill"></div>
          <div class="dot"></div>
          <div id="delta-0" class="split-delta">
            <span id="delta-val-0" class="split-delta-val"></span>
            <span id="time-val-0" class="split-time-val"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="hud-comp-timers"></div>
    <div id="hud-comp-track"></div>
    <div id="hud-comp-leaderboard"></div>
    <div id="race-leaderboard"></div>
    <div id="leaderboard-rows"></div>
    <span id="badge-scale-leaderboard"></span>
    <span id="leaderboard-status-badge"></span>
    <input type="checkbox" id="cb-toggle-leaderboard">
    <button id="btn-toggle-leaderboard"></button>
    <span id="gold-toggle-badge"></span>
    <span id="timing-method-badge"></span>
    <span id="comparison-badge"></span>
    <span id="ghost-badge"></span>
    <span id="bg-opacity-badge"></span>
    <span id="split-density-badge"></span>
    <span id="split-angle-badge"></span>
    <span id="track-orient-badge"></span>
    <div id="ctrl-track-orient"></div>
    <div id="ctrl-name-pos"></div>
    <div id="ctrl-delta-pos"></div>
    <div id="ctrl-timer-display"></div>
    <div id="ctrl-timer-focus"></div>
    <div id="quick-settings-wrap">
      <div id="footer-bar">
        <div class="settings-menu-header"></div>
        <button id="btn-close-settings"></button>
      </div>
    </div>
    <button id="settings-trigger-pill"></button>
    <input type="file" id="file-input">
    <select id="select-layout-profile"></select>
    <button id="btn-save-profile"></button>
    <button id="btn-save-as-profile"></button>
    <button id="btn-delete-profile"></button>
    <button id="btn-export-profile"></button>
    <input type="file" id="input-import-profile">
    <div id="profile-bar-default"></div>
    <div id="profile-dropdown-wrap"></div>
    <button id="btn-profile-dropdown"></button>
    <span id="profile-dropdown-label"></span>
    <div id="profile-dropdown-list"></div>
    <div id="profile-bar-new"></div>
    <input type="text" id="input-new-profile-name">
    <button id="btn-confirm-new-profile"></button>
    <button id="btn-cancel-new-profile"></button>
    <div id="profile-bar-delete"></div>
    <button id="btn-confirm-delete-profile"></button>
    <button id="btn-cancel-delete-profile"></button>
    <button id="btn-open-import-modal"></button>
    <div id="layout-export-modal"></div>
    <button id="btn-close-export-modal"></button>
    <div id="export-status-banner"></div>
    <span id="export-filename-label"></span>
    <textarea id="export-json-textarea"></textarea>
    <button id="btn-copy-export-json"></button>
    <button id="btn-redownload-export-json"></button>
    <div id="layout-import-modal"></div>
    <button id="btn-close-import-modal"></button>
    <span id="import-file-name-label"></span>
    <textarea id="import-json-textarea"></textarea>
    <div id="import-error-msg"></div>
    <button id="btn-cancel-import"></button>
    <button id="btn-apply-import-json"></button>
  </div>

  <div class="header">
    <h1>🧪 LiveSplit Overlay Unit Tests</h1>
    <div id="total-badge" class="badge pass">Running...</div>
  </div>

  <div id="results"></div>

  <!-- Load application scripts -->
  <script src="../src/core/storage.js"></script>
  <script src="../src/core/time-utils.js"></script>
  <script src="../src/core/split-engine.js"></script>
  <script src="../src/core/ghost-math.js"></script>
  <script src="../src/core/livesplit-client.js"></script>
  <script src="../src/core/race-client.js"></script>
  <script src="../src/ui/layout-engine.js"></script>
  <script src="../src/ui/track-renderer.js"></script>
  <script src="../src/ui/interactions.js"></script>
  <script src="../src/ui/leaderboard.js"></script>
  <script src="../layout.js"></script>
  <script src="../overlay.js"></script>

  <script>
    const suites = [];
    let currentSuite = null;
    let totalPassed = 0;
    let totalFailed = 0;

    function describe(name, fn) {
      currentSuite = { name, tests: [] };
      suites.push(currentSuite);
      fn();
    }

    function it(name, testFn) {
      try {
        testFn();
        currentSuite.tests.push({ name, pass: true });
        totalPassed++;
      } catch (err) {
        currentSuite.tests.push({ name, pass: false, error: err.message });
        totalFailed++;
      }
    }

    function assertEqual(actual, expected, message) {
      const aStr = JSON.stringify(actual);
      const eStr = JSON.stringify(expected);
      if (aStr !== eStr) {
        throw new Error(message || `Expected ${eStr}, got ${aStr}`);
      }
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || "Assertion failed");
      }
    }

    // --- TEST DEFINITIONS ---

    describe("Time Conversion: timeStringToSeconds", () => {
      it("parses seconds only correctly", () => {
        assertEqual(window.timeStringToSeconds("45.2"), 45.2);
      });
      it("parses MM:SS correctly", () => {
        assertEqual(window.timeStringToSeconds("01:23.45"), 83.45);
      });
      it("parses HH:MM:SS correctly", () => {
        assertEqual(window.timeStringToSeconds("01:02:03"), 3723);
      });
      it("parses days format DD.HH:MM:SS correctly", () => {
        assertEqual(window.timeStringToSeconds("1.00:00:00"), 86400);
      });
      it("returns null on empty, hyphen, or invalid input", () => {
        assertEqual(window.timeStringToSeconds("-"), null);
        assertEqual(window.timeStringToSeconds(""), null);
        assertEqual(window.timeStringToSeconds(null), null);
      });
    });

    describe("Time Formatting: formatTargetTime", () => {
      it("formats zero seconds as 0:00", () => {
        assertEqual(window.formatTargetTime(0), "0:00");
      });
      it("formats under 1 hour as MM:SS", () => {
        assertEqual(window.formatTargetTime(125), "2:05");
      });
      it("formats over 1 hour as H:MM:SS", () => {
        assertEqual(window.formatTargetTime(3665), "1:01:05");
      });
      it("returns empty string on null or NaN", () => {
        assertEqual(window.formatTargetTime(null), "");
        assertEqual(window.formatTargetTime(NaN), "");
      });
    });

    describe("Delta Formatting: formatDeltaSeconds", () => {
      it("formats neutral delta under 0.05s as ±0.0", () => {
        assertEqual(window.formatDeltaSeconds(0.0), "±0.0");
        assertEqual(window.formatDeltaSeconds(0.04), "±0.0");
        assertEqual(window.formatDeltaSeconds(-0.04), "±0.0");
      });
      it("formats ahead deltas with minus sign", () => {
        assertEqual(window.formatDeltaSeconds(-1.5), "-1.5");
        assertEqual(window.formatDeltaSeconds(-65.2), "-1:05");
      });
      it("formats behind deltas with plus sign", () => {
        assertEqual(window.formatDeltaSeconds(12.3), "+12.3");
        assertEqual(window.formatDeltaSeconds(125.0), "+2:05");
      });
    });

    describe("Comparison Normalization", () => {
      it("normalizes Personal Best aliases", () => {
        assertEqual(window.normalizeComparisonName("pb"), "Personal Best");
        assertEqual(window.normalizeComparisonName("Personal Best"), "Personal Best");
      });
      it("normalizes Best Segments aliases", () => {
        assertEqual(window.normalizeComparisonName("sum of best"), "Best Segments");
        assertEqual(window.normalizeComparisonName("best splits"), "Best Segments");
      });
      it("normalizes Average Segments aliases", () => {
        assertEqual(window.normalizeComparisonName("average"), "Average Segments");
      });
      it("normalizes Worst Segments aliases", () => {
        assertEqual(window.normalizeComparisonName("worst"), "Worst Segments");
      });
      it("returns null for empty or hyphen string", () => {
        assertEqual(window.normalizeComparisonName("-"), null);
      });
      it("generates correct short badge strings", () => {
        assertEqual(window.getShortComparisonName("Personal Best"), "PB");
        assertEqual(window.getShortComparisonName("Best Segments"), "Best Segs");
        assertEqual(window.getShortComparisonName("Average Segments"), "Average");
        assertEqual(window.getShortComparisonName("Worst Segments"), "Worst");
      });
    });

    describe("Live Delta String Parsing: formatDeltaLive", () => {
      it("parses unicode minus and fractions", () => {
        const res = window.formatDeltaLive("−5.2");
        assertEqual(res.isAhead, true);
        assertEqual(res.signedSeconds, -5.2);
      });
      it("parses positive minutes and seconds", () => {
        const res = window.formatDeltaLive("+1:20.5");
        assertEqual(res.isAhead, false);
        assertEqual(res.text, "+1:20");
      });
    });

    describe("Live Ghost Runner Engine", () => {
      it("calculates ghost segment index and ratio across run", () => {
        const times = [60, 120, 180, 240];
        const r0 = window.calculateGhostProgress(0, times);
        assertEqual(r0.segIdx, 0);
        assertEqual(r0.ratio, 0);

        const r30 = window.calculateGhostProgress(30, times);
        assertEqual(r30.segIdx, 0);
        assertEqual(Math.abs(r30.ratio - 0.5) < 0.001, true);

        const r90 = window.calculateGhostProgress(90, times);
        assertEqual(r90.segIdx, 1);
        assertEqual(Math.abs(r90.ratio - 0.5) < 0.001, true);

        const rFin = window.calculateGhostProgress(240, times);
        assertEqual(rFin.segIdx, 3);
        assertEqual(rFin.isFinished, true);

        const rOver = window.calculateGhostProgress(300, times);
        assertEqual(rOver.segIdx, 3);
        assertEqual(rOver.isFinished, true);

        // Sparse array interpolation
        const sparseTimes = [60.0, null, 180.0];
        const rSparse = window.calculateGhostProgress(30, sparseTimes);
        assertEqual(rSparse.segIdx, 0);
        assertEqual(Math.abs(rSparse.ratio - 0.5) < 0.001, true);

        // Empty array safety
        const rEmpty = window.calculateGhostProgress(30, []);
        assertEqual(rEmpty.segIdx, 0);
        assertEqual(rEmpty.ratio, 0);
      });
      it("sanitizes comparison time arrays properly", () => {
        assertEqual(typeof window.sanitizeComparisonTimes, "function");
        const raw = [100.0, null, 300.0];
        const fb = [120.0, 220.0, 320.0];
        const san = window.sanitizeComparisonTimes(raw, fb);
        assertEqual(san, [100.0, 220.0, 300.0]);
      });
      it("handles ghost setting toggles and cycling", () => {
        assertEqual(typeof window.setGhostComparison, "function");
        assertEqual(typeof window.cycleGhostComparison, "function");
        assertEqual(typeof window.toggleGhostComparison, "function");
        assertEqual(typeof window.getActiveGhostComparisons, "function");

        window.setGhostComparison("pb");
        assertEqual(window.getGhostComparison(), "pb");
        assertEqual(window.getActiveGhostComparisons(), ["pb"]);

        // Multi-ghost via array
        window.setGhostComparison(["wr", "pb"]);
        assertEqual(window.getActiveGhostComparisons(), ["wr", "pb"]);
        assertEqual(window.getGhostComparison(), "wr");

        // Multi-ghost via comma-separated string
        window.setGhostComparison("wr,pb");
        assertEqual(window.getActiveGhostComparisons(), ["wr", "pb"]);

        // Toggle on a third ghost
        window.toggleGhostComparison("best");
        assertEqual(window.getActiveGhostComparisons(), ["wr", "pb", "best"]);

        // Toggle off an active ghost
        window.toggleGhostComparison("wr");
        assertEqual(window.getActiveGhostComparisons(), ["pb", "best"]);

        // Toggle off clears all
        window.toggleGhostComparison("off");
        assertEqual(window.getActiveGhostComparisons(), ["off"]);
        assertEqual(window.getGhostComparison(), "off");
      });
      it("resolves multi-ghost comparison info and icons", () => {
        const wrInfo = window.getGhostComparisonInfo("wr");
        assertEqual(typeof wrInfo, "object");
        assertEqual(wrInfo.id, "wr");
        assertEqual(wrInfo.icon, "🏆");

        const pbInfo = window.getGhostComparisonInfo("pb");
        assertEqual(typeof pbInfo, "object");
        assertEqual(pbInfo.id, "pb");
        assertEqual(pbInfo.icon, "🥈");

        const bestInfo = window.getGhostComparisonInfo("best");
        assertEqual(typeof bestInfo, "object");
        assertEqual(bestInfo.id, "best");
        assertEqual(bestInfo.icon, "⭐");
      });
      it("detects timing method from comparison split time", () => {
        assertEqual(typeof window.detectTimingMethodFromComp, "function");
        // Test with mock comparison arrays
        window.comparisonTimesGT = [206.0, 686.0];
        window.comparisonTimesRT = [811.0, 1734.0];
        const resGT = window.detectTimingMethodFromComp(0, 206.0);
        assertEqual(resGT, "GameTime");
        assertEqual(window.getCurrentTimingMethod(), "GameTime");

        const resRT = window.detectTimingMethodFromComp(0, 811.0);
        assertEqual(resRT, "RealTime");
        assertEqual(window.getCurrentTimingMethod(), "RealTime");
      });
      it("dynamically adjusts ghost pin size threshold based on split text", () => {
        assertEqual(typeof window.getNodeTextThreshold, "function");
        // Null node fallback
        assertEqual(window.getNodeTextThreshold(null), 45);

        // Mock node element with split text
        const mockNode = document.createElement("div");
        mockNode.innerHTML = '<div class="split-name">Sinspawn Ammes</div><div class="split-delta"></div>';
        const thresh = window.getNodeTextThreshold(mockNode, false);
        assert(thresh >= 35, "Threshold should be at least 35px");
      });
      it("supports customizable and lowered ghost pin needle length", () => {
        if (window.hudLayout && window.hudLayout.getTrackStyle) {
          const style = window.hudLayout.getTrackStyle();
          assertEqual(typeof style.ghostPinLength, "number");
          assertEqual(style.ghostPinLength, 16);
        }
      });
    });

    describe("Track Orientation: Horizontal and Vertical Modes", () => {
      it("supports horizontal and vertical track orientation toggle", () => {
        if (window.hudLayout && window.hudLayout.setTrackOrientation) {
          window.hudLayout.setTrackOrientation("vertical");
          const style = window.hudLayout.getTrackStyle();
          assertEqual(style.orientation, "vertical");
          const track = document.getElementById("track");
          assertEqual(track.classList.contains("vertical"), true);

          // Switching to vertical should map positions to left/right
          assertEqual(["left", "right"].includes(style.namePos), true);
          assertEqual(["left", "right"].includes(style.deltaPos), true);

          // Switch back to horizontal
          window.hudLayout.setTrackOrientation("horizontal");
          assertEqual(style.orientation, "horizontal");
          assertEqual(track.classList.contains("vertical"), false);
          assertEqual(["top", "bottom"].includes(style.namePos), true);
          assertEqual(["top", "bottom"].includes(style.deltaPos), true);
        }
      });
      it("supports left/right positioning combinations in vertical mode", () => {
        if (window.hudLayout && window.hudLayout.setTrackOrientation) {
          window.hudLayout.setTrackOrientation("vertical");
          const style = window.hudLayout.getTrackStyle();

          // Test Name Left, Delta Right (Default Symmetrical)
          style.namePos = "left";
          style.deltaPos = "right";
          window.hudLayout.applyTrackStyle();
          const track = document.getElementById("track");
          assertEqual(track.classList.contains("pos-name-left"), true);
          assertEqual(track.classList.contains("pos-delta-right"), true);

          // Test Both on Right (Classic LiveSplit)
          style.namePos = "right";
          style.deltaPos = "right";
          window.hudLayout.applyTrackStyle();
          assertEqual(track.classList.contains("pos-name-right"), true);
          assertEqual(track.classList.contains("pos-delta-right"), true);

          // Restore to horizontal
          window.hudLayout.setTrackOrientation("horizontal");
        }
      });
    });

    describe("LiveSplit Undo Split & Connection Safety", () => {
      it("exports handleUndoSplit on window", () => {
        assertEqual(typeof window.handleUndoSplit, "function");
      });
      it("safely executes handleUndoSplit without errors", () => {
        window.handleUndoSplit(0, 1);
        assertEqual(true, true);
      });
    });

    describe("Timer Display Modes & Primary Focus", () => {
      it("exports setTimerDisplayMode, setTimingMethodFocus, and getTimerDisplayMode", () => {
        assertEqual(typeof window.setTimerDisplayMode, "function");
        assertEqual(typeof window.setTimingMethodFocus, "function");
        assertEqual(typeof window.getTimerDisplayMode, "function");
        assertEqual(typeof window.getCurrentTimingMethod, "function");
      });
      it("switches to Game Time as primary focus in both mode", () => {
        window.setTimerDisplayMode("both", "GameTime");
        assertEqual(window.getTimerDisplayMode(), "both");
        assertEqual(window.getCurrentTimingMethod(), "GameTime");
        const igt = document.getElementById("timer-igt");
        const rta = document.getElementById("timer-rta");
        assertEqual(igt.className, "timer-primary");
        assertEqual(rta.className, "timer-secondary");
      });
      it("switches to Real Time as primary focus in both mode", () => {
        window.setTimingMethodFocus("RealTime");
        assertEqual(window.getCurrentTimingMethod(), "RealTime");
        const igt = document.getElementById("timer-igt");
        const rta = document.getElementById("timer-rta");
        assertEqual(rta.className, "timer-primary");
        assertEqual(igt.className, "timer-secondary");
      });
      it("cycles 4 timing states via toggleTimingMethod", () => {
        window.setTimerDisplayMode("gametime", "GameTime");
        assertEqual(window.getTimerDisplayMode(), "gametime");

        window.toggleTimingMethod();
        assertEqual(window.getTimerDisplayMode(), "realtime");
        assertEqual(window.getCurrentTimingMethod(), "RealTime");

        window.toggleTimingMethod();
        assertEqual(window.getTimerDisplayMode(), "both");
        assertEqual(window.getCurrentTimingMethod(), "GameTime");

        window.toggleTimingMethod();
        assertEqual(window.getTimerDisplayMode(), "both");
        assertEqual(window.getCurrentTimingMethod(), "RealTime");

        window.toggleTimingMethod();
        assertEqual(window.getTimerDisplayMode(), "gametime");
        assertEqual(window.getCurrentTimingMethod(), "GameTime");
      });
      it("supports clicking trigger pill to latch menu open (pressed down) and clicking again or close button to dismiss", () => {
        const wrap = document.getElementById("quick-settings-wrap");
        const pill = document.getElementById("settings-trigger-pill");
        const closeBtn = document.getElementById("btn-close-settings");

        wrap.classList.remove("menu-open");
        pill.classList.remove("is-pressed");

        // Click 1: Press down and latch open
        pill.click();
        assertEqual(wrap.classList.contains("menu-open"), true);
        assertEqual(pill.classList.contains("is-pressed"), true);

        // Click 2: Unpress and close
        pill.click();
        assertEqual(wrap.classList.contains("menu-open"), false);
        assertEqual(pill.classList.contains("is-pressed"), false);

        // Re-open then close via ✕ button
        pill.click();
        assertEqual(wrap.classList.contains("menu-open"), true);
        closeBtn.click();
        assertEqual(wrap.classList.contains("menu-open"), false);
        assertEqual(pill.classList.contains("is-pressed"), false);
      });
      it("remains idempotent and maintains single-click latching even if initOverlay is repeatedly called", () => {
        const wrap = document.getElementById("quick-settings-wrap");
        const pill = document.getElementById("settings-trigger-pill");

        // Simulate duplicate initialization calls (such as DOMContentLoaded + window.onload)
        if (typeof window.initOverlay === "function") {
          window.initOverlay();
          window.initOverlay();
        }

        wrap.classList.remove("menu-open");
        pill.classList.remove("is-pressed");

        // Single click must reliably open and latch pressed, without immediate cancellation
        pill.click();
        assertEqual(wrap.classList.contains("menu-open"), true);
        assertEqual(pill.classList.contains("is-pressed"), true);

        // Second click must reliably unpress and close
        pill.click();
        assertEqual(wrap.classList.contains("menu-open"), false);
        assertEqual(pill.classList.contains("is-pressed"), false);
      });
    });

    describe("Layout Profiles & Extensible Schema v1", () => {
      it("exports layout profile helper functions on window.hudLayout", () => {
        assertEqual(typeof window.hudLayout.getProfilesList, "function");
        assertEqual(typeof window.hudLayout.getActiveProfileName, "function");
        assertEqual(typeof window.hudLayout.createProfileExport, "function");
        assertEqual(typeof window.hudLayout.applyProfileData, "function");
        assertEqual(typeof window.hudLayout.saveProfileToStorage, "function");
        assertEqual(typeof window.hudLayout.deleteProfileFromStorage, "function");
      });
      it("generates schema v1 export object with required properties", () => {
        const exp = window.hudLayout.createProfileExport("TestProfile");
        assertEqual(exp.version, 1);
        assertEqual(exp.$schema, undefined);
        assertEqual(exp.name, "TestProfile");
        assertEqual(typeof exp.components, "object");
        assertEqual(typeof exp.style, "object");
        assertEqual(typeof exp.preferences, "object");
      });
      it("deep merges older layouts gracefully for backward compatibility", () => {
        const legacy = {
          schemaVersion: 1,
          name: "Old Profile",
          components: {
            title: { x: 50, y: 50, visible: true }
          },
          style: {
            orientation: "horizontal",
            bgOpacity: 75
          }
        };
        window.hudLayout.applyProfileData(legacy, "Old Profile");
        const style = window.hudLayout.getTrackStyle();
        assertEqual(style.bgOpacity, 75);
        assertEqual(typeof style.barHeight, "number");
        assertEqual(typeof style.logoHeight, "number");
      });
    });

    suite("Track Scrolling & Mousewheel", () => {
      it("setupTrackScrollInteractions is exposed and functional", () => {
        assertEqual(typeof window.setupTrackScrollInteractions, "function");
      });

      it("layout engine exports isEditMode getter", () => {
        assertEqual(typeof window.hudLayout.isEditMode, "function");
        assertEqual(window.hudLayout.isEditMode(), false);
      });

      it("scrolling listener handles wheel events without error", () => {
        const vp = document.getElementById("track-viewport");
        assert(vp !== null, "track-viewport exists");
        const wheelEvt = new WheelEvent("wheel", { deltaY: 50, cancelable: true });
        window.dispatchEvent(wheelEvt);
      });
    });

    suite("Skipped Splits & Incomplete Data", () => {
      it("ALL_SPLIT_STATE_CLASSES includes uncoloured", () => {
        const item = document.getElementById("item-0");
        assert(item !== null, "item-0 exists");
        item.classList.add("completed", "uncoloured");
        assert(item.classList.contains("uncoloured"), "item-0 accepts uncoloured class");
        item.classList.remove("uncoloured");
      });

      it("setDeltaDisplay handles uncoloured state and dash delta correctly", () => {
        const delta = { text: "-", isAhead: false, signedSeconds: 0 };
        window.setDeltaDisplay(0, delta, "uncoloured", null);
        const deltaSpan = document.getElementById("delta-val-0");
        const timeSpan = document.getElementById("time-val-0");
        const fill = document.getElementById("fill-0");
        const item = document.getElementById("item-0");
        assertEqual(deltaSpan.innerText, "-");
        assertEqual(timeSpan.innerText, "-");
        assert(fill.classList.contains("uncoloured"), "fill has uncoloured class");
        assert(item.classList.contains("uncoloured"), "item has uncoloured class");
      });

      it("setDeltaDisplay preserves completed time on incomplete comparison data", () => {
        const delta = { text: "-", isAhead: false, signedSeconds: 0 };
        window.setDeltaDisplay(0, delta, "uncoloured", 45.2);
        const timeSpan = document.getElementById("time-val-0");
        assert(timeSpan.innerText.includes("45") || timeSpan.innerText.includes("0:45"), "timeSpan displays split time");
      });
    });

    describe("Timer Milestone Formatting: formatTimerDisplay", () => {
      it("formats zero seconds as 0.00", () => {
        assert(window.formatTimerDisplay(0) === "0.00", "0 must format as 0.00");
        assert(window.formatTimerDisplay("0") === "0.00", "'0' must format as 0.00");
      });

      it("formats sub-minute times as S.hh without leading zero", () => {
        assert(window.formatTimerDisplay(5.2) === "5.20", "5.2 must format as 5.20");
        assert(window.formatTimerDisplay(42.85) === "42.85", "42.85 must format as 42.85");
      });

      it("formats times under 1 hour as M:SS.hh without leading zero on minutes", () => {
        assert(window.formatTimerDisplay(75.5) === "1:15.50", "75.5 must format as 1:15.50");
        assert(window.formatTimerDisplay(599.99) === "9:59.99", "599.99 must format as 9:59.99");
      });

      it("formats times over 1 hour as H:MM:SS.hh without leading zero on hours", () => {
        assert(window.formatTimerDisplay(3665.12) === "1:01:05.12", "3665.12 must format as 1:01:05.12");
      });

      it("handles negative times and avoids -0.00", () => {
        assert(window.formatTimerDisplay(-0.001) === "0.00", "Near zero negative must avoid -0.00");
        assert(window.formatTimerDisplay(-15.4) === "-15.40", "-15.4 must format as -15.40");
      });
    });

    describe("In-Run State Persistence: saveInRunState, loadInRunState, clearInRunState", () => {
      it("exports in-run state helper functions on window", () => {
        assert(typeof window.saveInRunState === "function", "saveInRunState exported");
        assert(typeof window.loadInRunState === "function", "loadInRunState exported");
        assert(typeof window.clearInRunState === "function", "clearInRunState exported");
      });

      it("persists and restores locked deltas across storage cycles", () => {
        window.clearInRunState();
        assert(localStorage.getItem("livesplit_in_run_state") === null, "storage cleared");
        window.saveInRunState();
        const raw = localStorage.getItem("livesplit_in_run_state");
        assert(raw !== null, "storage created on save");
        const loaded = window.loadInRunState();
        assert(typeof loaded === "boolean", "loadInRunState returns boolean");
        window.clearInRunState();
      });
    });

    describe("Always Show Last Split: updateTrackWindow", () => {
      it("exports updateTrackWindow, shiftTrackWindow, and isTrackWindowed on window", () => {
        assert(typeof window.updateTrackWindow === "function", "updateTrackWindow exported");
        assert(typeof window.shiftTrackWindow === "function", "shiftTrackWindow exported");
        assert(typeof window.isTrackWindowed === "function", "isTrackWindowed exported");
      });

      it("returns false and preserves continuous track when alwaysShowLast is disabled", () => {
        localStorage.setItem("livesplit_always_show_last_split", "false");
        const res = window.updateTrackWindow(0);
        assert(res === false, "returns false when disabled");
        localStorage.setItem("livesplit_always_show_last_split", "true");
      });

      it("shifts visible window with shiftTrackWindow when track is windowed", () => {
        localStorage.setItem("livesplit_always_show_last_split", "true");
        localStorage.setItem("livesplit_visible_splits", "8");
        const isWin = window.isTrackWindowed();
        if (isWin) {
          const offsetBefore = window.getTrackManualScrollOffset ? window.getTrackManualScrollOffset() : 0;
          const shifted = window.shiftTrackWindow(1);
          assert(typeof shifted === "boolean", "shiftTrackWindow returns boolean");
          const offsetAfter = window.getTrackManualScrollOffset ? window.getTrackManualScrollOffset() : 0;
          assert(offsetAfter >= offsetBefore, "offset shifted forward");
          window.shiftTrackWindow(-1);
        }
      });
    });

    describe("Comparison Switching: cycleComparison & Toast Notification", () => {
      it("exports cycleComparison and showComparisonToast on window", () => {
        assert(typeof window.cycleComparison === "function", "cycleComparison exported");
        assert(typeof window.showComparisonToast === "function", "showComparisonToast exported");
      });

      it("cycles through comparisons in both directions", () => {
        const curBefore = window.getCurrentComparison ? window.getCurrentComparison() : "Personal Best";
        window.cycleComparison(false);
        const curAfterNext = window.getCurrentComparison ? window.getCurrentComparison() : "Best Segments";
        assert(curAfterNext !== curBefore, "advances to next comparison");
        window.cycleComparison(true);
        const curAfterRev = window.getCurrentComparison ? window.getCurrentComparison() : "Personal Best";
        assert(curAfterRev === curBefore, "returns to original comparison on reverse");
      });

      it("renders hud-toast element with glassmorphic styling", () => {
        window.showComparisonToast("Personal Best");
        const toast = document.getElementById("hud-toast");
        assert(toast !== null, "#hud-toast element exists");
        assert(toast.classList.contains("hud-toast"), "has hud-toast class");
        assert(toast.innerText.includes("Personal Best"), "displays comparison name");
      });

      it("recalculates completed split deltas and segment states when switching comparisons", () => {
        const originalComp = window.getCurrentComparison ? window.getCurrentComparison() : "Personal Best";
        window.applyActiveComparison("Personal Best", false, false);
        
        // Cycle comparison to next
        window.cycleComparison(false);
        const compAfter = window.getCurrentComparison ? window.getCurrentComparison() : "";
        assert(compAfter !== originalComp, "successfully switches active comparison");

        // Revert back
        window.applyActiveComparison(originalComp, false, false);
      });
    });

    describe("Architectural Safeguards & Bug Fixes", () => {
      it("exports safeStorage with in-memory fallback on window", () => {
        assert(typeof window.safeStorage === "object", "safeStorage exported");
        assert(typeof window.safeStorage.getItem === "function", "getItem exists");
        assert(typeof window.safeStorage.setItem === "function", "setItem exists");
        assert(typeof window.safeStorage.removeItem === "function", "removeItem exists");
        
        window.safeStorage.setItem("test_key", "test_val");
        assertEqual(window.safeStorage.getItem("test_key"), "test_val");
        window.safeStorage.removeItem("test_key");
        assertEqual(window.safeStorage.getItem("test_key"), null);
      });

      it("layout profiles export and restore activeGhosts array", () => {
        const exp = window.hudLayout.createProfileExport("GhostProfileTest");
        assert(Array.isArray(exp.preferences.activeGhosts), "activeGhosts is an array in preferences");
      });
    });

    describe("Modular Architecture: LiveSplit Namespaces", () => {
      it("exposes LiveSplit namespace and core submodules", () => {
        assert(typeof window.LiveSplit === "object", "window.LiveSplit exists");
        assert(typeof window.LiveSplit.Storage === "object", "LiveSplit.Storage exists");
        assert(typeof window.LiveSplit.Time === "object", "LiveSplit.Time exists");
        assert(typeof window.LiveSplit.SplitEngine === "object", "LiveSplit.SplitEngine exists");
        assert(typeof window.LiveSplit.GhostMath === "object", "LiveSplit.GhostMath exists");
        assert(typeof window.LiveSplit.Client === "object", "LiveSplit.Client exists");
        assert(typeof window.LiveSplit.TrackRenderer === "object", "LiveSplit.TrackRenderer exists");
        assert(typeof window.LiveSplit.LayoutEngine === "object", "LiveSplit.LayoutEngine exists");
        assert(typeof window.LiveSplit.Interactions === "object", "LiveSplit.Interactions exists");
      });

      it("LiveSplit.Time parses and formats times correctly", () => {
        assertEqual(window.LiveSplit.Time.timeStringToSeconds("01:23.45"), 83.45);
        assertEqual(window.LiveSplit.Time.formatTargetTime(83.45), "1:23");
        assertEqual(window.LiveSplit.Time.formatTimerDisplay(83.45), "1:23.45");
        assertEqual(window.LiveSplit.Time.formatDeltaSeconds(-1.25), "-1.2");
      });

      it("LiveSplit.TrackRenderer provides zero-allocation element cache", () => {
        const cache = window.LiveSplit.TrackRenderer.createLiveElementCache();
        assert(typeof cache.getElements === "function", "cache.getElements exists");
        assert(typeof cache.invalidate === "function", "cache.invalidate exists");
        const res = cache.getElements(0);
        assert("fill" in res, "result contains fill");
        assert("deltaSpan" in res, "result contains deltaSpan");
      });
    });

    describe("Track Orientation & Split Density Reflow", () => {
      it("exports setTrackOrientation, updateTrackDensityAndAngle, and getVisibleSplitsCapacity", () => {
        assert(typeof window.setTrackOrientation === "function", "setTrackOrientation exported");
        assert(typeof window.updateTrackDensityAndAngle === "function", "updateTrackDensityAndAngle exported");
        assert(typeof window.getVisibleSplitsCapacity === "function", "getVisibleSplitsCapacity exported");
      });

      it("setTrackOrientation updates track class and resets viewport scroll positions", () => {
        const viewport = document.getElementById("track-viewport");
        if (viewport) {
          viewport.scrollLeft = 50;
          viewport.scrollTop = 50;
        }
        window.setTrackOrientation("vertical");
        const track = document.getElementById("track");
        assert(track.classList.contains("vertical"), "track contains vertical class");
        if (viewport) {
          assert(viewport.scrollLeft === 0, "scrollLeft reset to 0");
          assert(viewport.scrollTop === 0, "scrollTop reset to 0");
        }

        // Switch back to horizontal
        window.setTrackOrientation("horizontal");
        assert(!track.classList.contains("vertical"), "track vertical class removed");
        if (viewport) {
          assert(viewport.scrollLeft === 0, "scrollLeft reset to 0");
          assert(viewport.scrollTop === 0, "scrollTop reset to 0");
        }
      });

      it("getVisibleSplitsCapacity computes positive capacity without crashing in both orientations", () => {
        window.setTrackOrientation("vertical");
        const vertCap = window.getVisibleSplitsCapacity();
        assert(typeof vertCap === "number" && vertCap > 0, "vertical capacity is a positive number");

        window.setTrackOrientation("horizontal");
        const horizCap = window.getVisibleSplitsCapacity();
        assert(typeof horizCap === "number" && horizCap > 0, "horizontal capacity is a positive number");
      });

      it("updateTrackDensityAndAngle executes cleanly on Start screen (currentIndex = -1)", () => {
        let threw = false;
        try {
          window.updateTrackDensityAndAngle();
        } catch (e) {
          threw = true;
        }
        assert(!threw, "updateTrackDensityAndAngle runs without error at currentIndex = -1");
      });
    });

    describe("Live Race & F1 Dynamic Leaderboard", () => {
      it("LiveSplitLeaderboard exports renderLeaderboard and getPreviewEntrants", () => {
        assert(window.LiveSplit && window.LiveSplit.Leaderboard, "LiveSplit.Leaderboard is exported");
        assertEqual(typeof window.LiveSplit.Leaderboard.renderLeaderboard, "function");
        assertEqual(typeof window.LiveSplit.Leaderboard.getPreviewEntrants, "function");
      });

      it("getPreviewEntrants provides valid default mock entrants for Layout Mode", () => {
        const preview = window.LiveSplit.Leaderboard.getPreviewEntrants();
        assert(Array.isArray(preview) && preview.length >= 3, "preview entrants array has >= 3 entrants");
        assert(preview.some(e => e.isHost), "preview entrants includes host");
      });

      it("renderLeaderboard mounts rows into DOM cleanly", () => {
        const preview = window.LiveSplit.Leaderboard.getPreviewEntrants();
        window.LiveSplit.Leaderboard.renderLeaderboard(preview, false, false, true);
        const rows = document.querySelectorAll("#leaderboard-rows .leaderboard-row");
        assert(rows.length >= 3, "renders >= 3 rows into #leaderboard-rows");
      });

      it("LiveSplit.RaceClient is direct instance with getRankedEntrants and simulation controls", () => {
        const rc = window.LiveSplit.RaceClient;
        assert(rc, "RaceClient exists");
        assertEqual(typeof rc.getRankedEntrants, "function");
        assertEqual(typeof rc.startSimulation, "function");
        assertEqual(typeof rc.stopSimulation, "function");
        assertEqual(typeof rc.isSimulating, "function");
        assertEqual(rc.isSimulating(), false);

        rc.startSimulation(["Split 1", "Split 2"], [30, 60]);
        assertEqual(rc.isSimulating(), true);
        const entrants = rc.getRankedEntrants();
        assert(entrants.length >= 4, "Simulation provides host + 3 virtual competitors");

        rc.stopSimulation();
        assertEqual(rc.isSimulating(), false);
      });

      it("Simulated competitors advance through split names dynamically", () => {
        const rc = window.LiveSplit.RaceClient;
        const splits = ["Forest", "Cave", "Castle", "Boss"];
        const comps = [20, 40, 60, 80];
        rc.startSimulation(splits, comps);

        const entrants = rc.getRankedEntrants();
        const comp1 = entrants.find(e => !e.isHost);
        assert(comp1, "competitor exists");
        assertEqual(comp1.currentSplitName, "Forest");

        // Simulate host progressing past 45s (into 'Castle' split)
        rc.updateHostProgress(50, 2, [20, 40], comps, "Castle", splits);
        const updated = rc.getRankedEntrants();
        const updatedComp = updated.find(e => e.userId === comp1.userId);
        assert(updatedComp.currentSplitName === "Castle" || updatedComp.currentSplitName === "Boss" || updatedComp.currentSplitName === "Cave",
          "competitor split advanced based on pace");

        rc.stopSimulation();
      });

      it("Mute button toggles entrant muted state and leaderboard row persists", () => {
        const rc = window.LiveSplit.RaceClient;
        rc.startSimulation(["Split 1", "Split 2"], [30, 60]);
        const entrants = rc.getRankedEntrants();
        const rival = entrants.find(e => !e.isHost);

        assertEqual(rival.isMuted, false);
        rc.toggleEntrantMuted(rival.userId);
        assertEqual(rival.isMuted, true);

        window.LiveSplit.Leaderboard.renderLeaderboard(rc.getRankedEntrants(), true, false, false);
        const row = document.querySelector(`.leaderboard-row[data-user-id="${rival.userId}"]`);
        assert(row, "row exists");
        assert(row.classList.contains("is-muted"), "row has is-muted class");

        const btn = row.querySelector(".racer-mute-btn");
        assert(btn, "mute button exists");
        assertEqual(btn.textContent, "🔇");

        // Simulate user clicking un-mute button
        btn.click();
        assertEqual(rival.isMuted, false);
        assert(!row.classList.contains("is-muted"), "row is un-muted");
        assertEqual(btn.textContent, "👁️");

        rc.stopSimulation();
      });

      it("Repeated leaderboard renders preserve all entrant rows without dropping positions", () => {
        const rc = window.LiveSplit.RaceClient;
        rc.startSimulation(["Split 1", "Split 2"], [30, 60]);
        const entrants = rc.getRankedEntrants();
        assertEqual(entrants.length, 4);

        // Call renderLeaderboard multiple times rapidly (as occurs at 60 FPS)
        for (let t = 0; t < 10; t++) {
          window.LiveSplit.Leaderboard.renderLeaderboard(rc.getRankedEntrants(), true, false, false);
        }

        const rows = document.querySelectorAll("#leaderboard-rows .leaderboard-row");
        assertEqual(rows.length, 4, "all 4 rows remain present in DOM without dropping");
        rc.stopSimulation();
      });

      it("Leaderboard calculates realistic track deltas and displays INT badge", () => {
        const rc = window.LiveSplit.RaceClient;
        rc.startSimulation(["Split 1", "Split 2", "Split 3"], [30, 60, 90]);
        // Simulate host progress at 45s
        rc.updateHostProgress(45, 1, [30], [30, 60, 90], "Split 2", ["Split 1", "Split 2", "Split 3"]);

        const entrants = rc.getRankedEntrants();
        assertEqual(entrants[0].gapDisplay, "LEADER");
        assert(entrants[1].gapToLeaderSec >= 0, "P2 has positive gap to leader");
        assert(entrants[1].gapDisplay.startsWith("+"), "P2 gap starts with +");

        window.LiveSplit.Leaderboard.renderLeaderboard(entrants, true, false, false);
        const intTags = document.querySelectorAll("#leaderboard-rows .interval-tag");
        assert(intTags.length >= 2, "INT badges rendered for non-leader entrants");

        rc.stopSimulation();
      });

      it("Reset cleanly clears simulation state and leaderboard transforms", () => {
        const rc = window.LiveSplit.RaceClient;
        rc.startSimulation(["Split 1", "Split 2"], [30, 60]);
        rc.updateHostProgress(45, 1, [30], [30, 60], "Split 2");

        assertEqual(typeof rc.reset, "function");
        assertEqual(typeof window.LiveSplit.Leaderboard.reset, "function");

        rc.reset();
        const entrants = rc.getRankedEntrants();
        assertEqual(entrants[0].currentTimeSec, 0);

        window.LiveSplit.Leaderboard.renderLeaderboard(entrants, true, false, false);
        const rows = document.querySelectorAll("#leaderboard-rows .leaderboard-row");
        rows.forEach((r) => {
          assertEqual(r.style.transform, "");
        });

        rc.stopSimulation();
      });

      it("updateGhostRunner executes cleanly during race simulation", () => {
        const rc = window.LiveSplit.RaceClient;
        rc.startSimulation(["Split 1", "Split 2"], [30, 60]);
        let threw = false;
        try {
          window.updateGhostRunner(10);
        } catch (e) {
          threw = true;
        }
        rc.stopSimulation();
        assert(!threw, "updateGhostRunner does not throw error during simulation");
      });
    });

    // --- RENDER RESULTS ---
    const resultsContainer = document.getElementById("results");
    suites.forEach((suite) => {
      const card = document.createElement("div");
      card.className = "suite-card";

      const title = document.createElement("div");
      title.className = "suite-title";
      title.innerText = suite.name;
      card.appendChild(title);

      suite.tests.forEach((t) => {
        const row = document.createElement("div");
        row.className = "test-row";
        row.innerHTML = `
          <div>
            <div class="test-name">${t.name}</div>
            ${t.error ? `<div class="error-msg">⚠️ ${t.error}</div>` : ""}
          </div>
          <span class="status-pill ${t.pass ? "ok" : "error"}">${t.pass ? "PASSED" : "FAILED"}</span>
        `;
        card.appendChild(row);
      });

      resultsContainer.appendChild(card);
    });

    const badge = document.getElementById("total-badge");
    if (totalFailed === 0) {
      badge.className = "badge pass";
      badge.innerText = `✓ ALL ${totalPassed} TESTS PASSED`;
    } else {
      badge.className = "badge fail";
      badge.innerText = `❌ ${totalFailed} FAILED / ${totalPassed} PASSED`;
    }
  </script>
</body>
